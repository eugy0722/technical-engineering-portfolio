<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description"
          content="Technica Engineering by Eugênio Kaxinga">

    <meta name="author" content="Eugênio Kaxinga">

    <title>Technical Engineering | Eugênio Kaxinga</title>

    <style>
        :root {
            --navy: #142B46;
            --blue: #2679B9;
            --light: #F3F6FA;
            --charcoal: #253342;
            --white: #FFFFFF;
            --border: #DCE3EB;
            --muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--light);
            border-radius: 12px;
            text-align: center;
        }

        .brand {
            color: var(--navy);
            font-size: 14px;
            font-weight: 760;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-top: 24px;
            color: var(--navy);
            font-size: clamp(28px, 5vw, 42px);
        }

        .subtitle {
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .language-options {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 36px;
        }

        .language-link {
            min-height: 150px;
            padding: 14px 24px;
            border: 1px solid var(--blue);
            border-radius: 6px;
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        footer {
            margin-top: 40px;
            color: var(--muted);
            font-size: 13px;
        }

        
        @media (max-width: 639px) {
          .section {
            padding-block: var(--space-8);
          }
      
          .grid {
            grid-template-columns: repeat(
              var(--grid-columns-mobile),
              minmax(0, 1fr)
            );
          }
      
          .grid--2,
          .grid--3,
          .grid--4 {
            grid-template-columns: 1fr;
          }
      
          .container {
            width: min(
              calc(100% - 2 * var(--space-4)),
              var(--container-max-width)
            );
          }
        }
        
    </style>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Foundation -->
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">

</head>
<body>
    <main class="language-selector">
        <p class="brand">Technical Engineering</p>

        <h1>Learn. Build. Document. Engineer.</h1>

        <p class="subtitle">
            Select your preferred language to explore my professional portfolio.
        </p>

        <nav class="language-options"
             aria-label="Language selection">
            <a href="pt/index.html" class="language-link">
                Português
            </a>
            <a href="en/index.html" class="languange-link">
                English
            </a>
        </nav>

        <footer>
            <p>Presented by Eugênio Kaxinga</p>
        </footer>
    </main>
    
</body>
</html>
