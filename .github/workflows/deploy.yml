
name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: true

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install locked dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Validate JSON files
      - name: Validate JSON
        run: |
          python3 -m json.tool data/projects.json > /dev/null
          python3 -m json.tool data/certifications.json > /dev/null
          python3 -m json.tool data/articles.json > /dev/null

      # 5. Validate required source files
      - name: Validate required files
        run: |
          test -f index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f pt/index.html
          test -f en/index.html
          test -f package.json
          test -f package-lock.json

      # 6. Generate optimized production website
      - name: Build production website
        run: npm run build

      # 7. Validate production output
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/pt/index.html
          test -f dist/en/index.html

      # 8. Upload artifact for GitHub Pages
      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 9. Publish website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
